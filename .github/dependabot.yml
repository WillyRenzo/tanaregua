version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    # Mesma ideia do min-release-age do .npmrc: não adotar versões recém-publicadas.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Imagens base dos Dockerfiles e do compose de produção (node, postgres, caddy).
  # As correções de segurança dentro de uma tag (ex.: node:24-alpine) chegam pelo
  # `docker build --pull` do job `images` a cada push no main.
  - package-ecosystem: docker
    directories: [/backend, /frontend, /deploy/backup]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

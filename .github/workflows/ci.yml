name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Variáveis mínimas para o ConfigModule subir no export do OpenAPI (os testes
    # definem as próprias em test/setup-env.ts e sobem Postgres via Testcontainers).
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_ACCESS_SECRET: ci-secret-with-at-least-thirty-two-characters
      CORS_ORIGINS: http://localhost:3000
      APP_PUBLIC_URL: http://localhost:3000
      MAIL_FROM: CI <ci@tanaregua.local>
    steps:
      # Actions de terceiros fixadas por SHA (security.md → supply chain).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unitários + e2e (Postgres real via Testcontainers) com gate de cobertura (AFA 19).
      - run: npm run test:cov
      - run: npm run build
      - name: Contrato OpenAPI em dia
        run: |
          npm run openapi:export
          git diff --exit-code contracts/openapi.json || {
            echo "::error::contracts/openapi.json desatualizado. Rode 'npm run openapi:export' e commite."
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # O contrato vem do backend versionado no mesmo repositório.
      OPENAPI_PATH: ../backend/contracts/openapi.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cliente da API em dia com o contrato
        run: |
          npm run api:generate
          git diff --exit-code src/lib/api/schema.d.ts || {
            echo "::error::schema.d.ts desatualizado. Rode 'npm run api:generate' e commite."
            exit 1
          }
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Publica as imagens de produção no GHCR só depois de backend e frontend passarem, e só
  # no main. A tag é o SHA do commit: deploy e rollback escolhem a versão por ele.
  images:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build e push das imagens
        run: |
          prefix="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/tanaregua"
          label="org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
          docker build --pull --label "$label" --target runtime -t "$prefix-backend:$GITHUB_SHA" backend
          docker build --pull --label "$label" --target migrate -t "$prefix-migrate:$GITHUB_SHA" backend
          docker build --pull --label "$label" -t "$prefix-frontend:$GITHUB_SHA" frontend
          for image in backend migrate frontend; do
            docker push "$prefix-$image:$GITHUB_SHA"
          done
